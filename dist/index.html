<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172a31">
  <meta name="description" content="DCI Master — a bilingual learning workspace scaffold.">
  <title>DCI Master · Home</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5v15M3 4h5c2 0 4 1 4 3 0-2 2-3 4-3h5v15h-5c-2 0-4 1-4 2 0-1-2-2-4-2H3z"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V4h6l3 3h9v13H3z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="DCI Master">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>DCI<span class="brand-light"> MASTER</span></span>
      </a>
      <div class="sidebar-caption" data-i18n="workspace">WORKSPACE</div>
      <nav class="primary-nav" data-i18n-label="mainNav" aria-label="Main navigation">
        <a href="#home" data-page="home"><svg class="icon"><use href="#icon-home"/></svg><span data-i18n="home">Home</span><span class="nav-dot" aria-hidden="true"></span></a>
        <a href="#lessons" data-page="lessons"><svg class="icon"><use href="#icon-book"/></svg><span data-i18n="lessons">Lessons</span><span class="nav-dot" aria-hidden="true"></span></a>
        <a href="#resources" data-page="resources"><svg class="icon"><use href="#icon-folder"/></svg><span data-i18n="resources">Resources</span><span class="nav-dot" aria-hidden="true"></span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="version-line"><span class="small-square" aria-hidden="true"></span><span data-i18n="shellStatus">Site scaffold</span><span class="mono">v0.1</span></div>
        <a class="repo-link" href="https://github.com/dfirwiz/dci-master" target="_blank" rel="noopener noreferrer"><span class="repo-caption" data-i18n="repository">SOURCE REPOSITORY</span><span>dfirwiz / dci-master <svg class="icon"><use href="#icon-external"/></svg></span></a>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="menu-button" id="menu-button" aria-expanded="false" aria-controls="sidebar" aria-label="Open menu"><svg class="icon"><use href="#icon-menu"/></svg></button>
          <span class="breadcrumb">DCI Master <span aria-hidden="true">/</span> <span id="breadcrumb-current">Home</span></span>
        </div>
        <div class="language-control">
          <svg class="icon language-icon" aria-hidden="true"><use href="#icon-globe"/></svg>
          <div class="language-buttons" role="group" data-i18n-label="language" aria-label="Select language">
            <button type="button" data-lang="ko" lang="ko" aria-pressed="false">한국어</button>
            <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <section class="page-heading" aria-labelledby="page-title">
          <div class="eyebrow"><span class="eyebrow-line"></span><span id="page-eyebrow">YOUR LEARNING WORKSPACE</span></div>
          <div class="heading-row"><h1 id="page-title">Your DCI workspace</h1><span class="outline-badge" data-i18n="inPreparation">In preparation</span></div>
          <p id="page-description">A space for your future lessons and resources.</p>
        </section>
        <div id="view" aria-live="polite"></div>
        <footer class="main-footer"><span>DCI MASTER</span><span data-i18n="footer">Learning content in preparation</span></footer>
      </main>
    </div>
  </div>
  <template id="home-template">
    <div class="overview-layout">
      <section class="panel curriculum-panel" aria-labelledby="curriculum-title">
        <div class="panel-heading"><div><span class="section-number">01</span><h2 id="curriculum-title" data-i18n="curriculum">Curriculum</h2></div><svg class="icon" aria-hidden="true"><use href="#icon-book"/></svg></div>
        <div class="course-empty">
          <div class="course-drawing" aria-hidden="true"><span class="drawing-sheet sheet-back"></span><span class="drawing-sheet sheet-front"><i></i><i></i><i></i></span><span class="drawing-dot"></span></div>
          <h3 data-i18n="noLessons">No lessons yet</h3>
          <p data-i18n="lessonsEmptyDescription">New lessons will appear here when added.</p>
          <a class="primary-button" href="#lessons"><span data-i18n="openLessons">View lessons</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
        </div>
        <div class="panel-bottom"><span class="tiny-square" aria-hidden="true"></span><span data-i18n="emptyCurriculum">The curriculum has not been set up yet</span></div>
      </section>
      <section class="panel resource-panel" aria-labelledby="resource-title">
        <div class="panel-heading"><div><span class="section-number">02</span><h2 id="resource-title" data-i18n="resourceLibrary">Resource library</h2></div><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg></div>
        <div class="resource-empty"><span class="empty-folder" aria-hidden="true"><svg><use href="#icon-folder"/></svg></span><h3 data-i18n="noResources">No resources yet</h3><p data-i18n="resourcesEmptyDescription">A space for reference materials and practice files.</p></div>
        <a class="text-link" href="#resources"><span data-i18n="openResources">View resources</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
      </section>
    </div>
  </template>
</body>
</html>
